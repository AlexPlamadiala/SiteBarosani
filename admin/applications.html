<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cereri - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">🏆 Admin Panel - Zidul Barosanilor</h1>
            <div class="flex items-center gap-4">
                <!-- SSE Status Badge -->
                <div id="sseStatus" class="hidden bg-green-500 px-3 py-1 rounded-lg shadow-lg flex items-center gap-2 text-xs">
                    <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                    <span>Live Updates</span>
                </div>
                <!-- Refresh Indicator -->
                <div id="refreshIndicator" class="hidden bg-yellow-500 px-3 py-1 rounded-lg shadow-lg flex items-center gap-2 text-xs animate-pulse">
                    <div class="w-2 h-2 bg-white rounded-full"></div>
                    <span>Actualizare...</span>
                </div>
                <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600">Logout</button>
            </div>
        </div>
    </nav>

    <div class="bg-white shadow">
        <div class="container mx-auto px-4">
            <div class="flex space-x-4">
                <a href="dashboard.html" class="px-4 py-3 text-gray-600 hover:text-gray-800">Dashboard</a>
                <a href="barosani.html" class="px-4 py-3 text-gray-600 hover:text-gray-800">Barosani</a>
                <a href="applications.html" class="px-4 py-3 border-b-2 border-blue-600 font-semibold text-blue-600">Cereri</a>
                <a href="logs.html" class="px-4 py-3 text-gray-600 hover:text-gray-800">Logs</a>
            </div>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow">
            <div class="p-6 border-b">
                <h2 class="text-2xl font-bold">Cereri de Înscriere</h2>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cod</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nume</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Revolut</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tier</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Sumă</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Data</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Acțiuni</th>
                        </tr>
                    </thead>
                    <tbody id="applicationsTable" class="divide-y divide-gray-200">
                        <tr>
                            <td colspan="9" class="px-6 py-4 text-center text-gray-500">Se încarcă...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // SSE State
        let sseConnected = false;
        let eventSource = null;

        async function checkAuth() {
            const response = await fetch('http://localhost/SiteBarosani/api/auth.php', {
                credentials: 'include'
            });
            const data = await response.json();
            if (!data.authenticated) window.location.href = 'index.html';
        }

        function showRefreshIndicator() {
            document.getElementById('refreshIndicator').classList.remove('hidden');
        }

        function hideRefreshIndicator() {
            document.getElementById('refreshIndicator').classList.add('hidden');
        }

        async function loadApplications(showIndicator = true) {
            if (showIndicator) showRefreshIndicator();
            try {
                const response = await fetch('http://localhost/SiteBarosani/api/admin/applications.php', {
                    credentials: 'include'
                });
                const data = await response.json();

                const tbody = document.getElementById('applicationsTable');

                if (!data.success || data.applications.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="px-6 py-4 text-center text-gray-500">Nicio cerere</td></tr>';
                    return;
                }

                tbody.innerHTML = data.applications.map(app => {
                    const statusColors = {
                        pending: 'bg-yellow-100 text-yellow-800',
                        payment_confirmed: 'bg-blue-100 text-blue-800',
                        approved: 'bg-green-100 text-green-800',
                        rejected: 'bg-red-100 text-red-800'
                    };

                    const statusLabels = {
                        pending: 'Pending',
                        payment_confirmed: 'Plată OK',
                        approved: 'Aprobat',
                        rejected: 'Respins'
                    };

                    return `
                        <tr>
                            <td class="px-6 py-4 text-sm font-mono">${app.code}</td>
                            <td class="px-6 py-4 text-sm font-medium">${app.nume}</td>
                            <td class="px-6 py-4 text-sm">${app.email}</td>
                            <td class="px-6 py-4 text-sm">@${app.revolut_id}</td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-1 text-xs font-semibold rounded uppercase ${
                                    app.tier === 'platinum' ? 'bg-gray-200' :
                                    app.tier === 'gold' ? 'bg-yellow-200' : 'bg-blue-200'
                                }">
                                    ${app.tier}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-sm font-semibold">${app.suma} RON</td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-1 text-xs font-semibold rounded ${statusColors[app.status]}">
                                    ${statusLabels[app.status]}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-sm">${new Date(app.created_at).toLocaleDateString('ro-RO')}</td>
                            <td class="px-6 py-4 text-sm space-x-2">
                                ${app.status === 'pending' || app.status === 'payment_confirmed' ? `
                                    <button onclick="approveApplication(${app.id})" class="text-green-600 hover:text-green-800 font-semibold">
                                        ✓ Aprobă
                                    </button>
                                    <button onclick="rejectApplication(${app.id})" class="text-red-600 hover:text-red-800 font-semibold">
                                        ✗ Respinge
                                    </button>
                                ` : ''}
                                <button onclick="deleteApplication(${app.id})" class="text-gray-600 hover:text-gray-800">
                                    🗑️
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error:', error);
            } finally {
                hideRefreshIndicator();
            }
        }

        function setupSSE() {
            try {
                eventSource = new EventSource('http://localhost/SiteBarosani/api/sse/updates.php');

                eventSource.addEventListener('connected', (e) => {
                    console.log('SSE Connected:', e.data);
                    sseConnected = true;
                    document.getElementById('sseStatus').classList.remove('hidden');
                });

                eventSource.addEventListener('applications-updated', (e) => {
                    console.log('Applications updated:', e.data);
                    loadApplications(true); // Refresh instant când se modifică cererile
                });

                eventSource.addEventListener('heartbeat', (e) => {
                    // Keep-alive heartbeat
                });

                eventSource.onerror = (err) => {
                    console.error('SSE Error:', err);
                    sseConnected = false;
                    document.getElementById('sseStatus').classList.add('hidden');
                    // SSE va încerca automat să reconecteze
                };
            } catch (err) {
                console.error('Failed to establish SSE connection:', err);
            }
        }

        async function approveApplication(id) {
            if (!confirm('Aprobă această cerere? Barosanul va fi adăugat pe zid.')) return;

            try {
                const response = await fetch('http://localhost/SiteBarosani/api/admin/applications.php', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ action: 'approve', id })
                });

                const data = await response.json();
                if (data.success) {
                    alert('Cerere aprobată cu succes!');
                    loadApplications();
                } else {
                    alert('Eroare: ' + data.error);
                }
            } catch (error) {
                alert('Eroare de conexiune');
            }
        }

        async function rejectApplication(id) {
            const notes = prompt('Motiv respingere (opțional):');
            if (notes === null) return;

            try {
                const response = await fetch('http://localhost/SiteBarosani/api/admin/applications.php', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ action: 'reject', id, notes })
                });

                const data = await response.json();
                if (data.success) {
                    alert('Cerere respinsă');
                    loadApplications();
                }
            } catch (error) {
                alert('Eroare de conexiune');
            }
        }

        async function deleteApplication(id) {
            if (!confirm('Ștergi definitiv această cerere?')) return;

            try {
                const response = await fetch('http://localhost/SiteBarosani/api/admin/applications.php?id=' + id, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                const data = await response.json();
                if (data.success) {
                    loadApplications();
                }
            } catch (error) {
                alert('Eroare de conexiune');
            }
        }

        async function logout() {
            await fetch('http://localhost/SiteBarosani/api/auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ action: 'logout' })
            });
            window.location.href = 'index.html';
        }

        // Initialize
        checkAuth();
        loadApplications(false); // Initial load fără indicator

        // Setup SSE pentru real-time updates
        setupSSE();

        // Fallback polling la 30 secunde (doar dacă SSE nu funcționează)
        setInterval(() => {
            if (!sseConnected) {
                loadApplications(false);
            }
        }, 30000);

        // Cleanup SSE când se închide pagina
        window.addEventListener('beforeunload', () => {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>
</html>
