<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-600 to-blue-800 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">🏆</div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Admin Panel</h1>
            <p class="text-gray-600">Zidul Barosanilor</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <span id="errorText"></span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                <input
                    type="text"
                    id="username"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="admin"
                >
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Parolă</label>
                <input
                    type="password"
                    id="password"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="••••••••"
                >
            </div>

            <button
                type="submit"
                id="loginButton"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
                Login
            </button>
        </form>

        <!-- Info -->
        <div class="mt-6 p-4 bg-blue-50 rounded-lg">
            <p class="text-xs text-blue-800 text-center">
                <strong>Default Login:</strong><br>
                Username: <code class="bg-blue-200 px-2 py-1 rounded">admin</code><br>
                Parolă: <code class="bg-blue-200 px-2 py-1 rounded">Barosan2025!</code>
            </p>
        </div>

        <!-- Link to Site -->
        <div class="mt-6 text-center">
            <a href="http://localhost:5173" target="_blank" class="text-sm text-gray-600 hover:text-blue-600">
                ← Înapoi la site
            </a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const loginButton = document.getElementById('loginButton');

        // Check if already authenticated
        async function checkAuth() {
            try {
                const response = await fetch('http://localhost/SiteBarosani/api/auth.php', {
                    credentials: 'include'
                });
                const data = await response.json();
                if (data.authenticated) {
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.error('Error checking auth:', error);
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Hide error
            errorMessage.classList.add('hidden');

            // Disable button
            loginButton.disabled = true;
            loginButton.textContent = 'Se autentifică...';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost/SiteBarosani/api/auth.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        action: 'login',
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Success - redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    // Show error
                    errorText.textContent = data.error || 'Eroare la autentificare';
                    errorMessage.classList.remove('hidden');

                    // Re-enable button
                    loginButton.disabled = false;
                    loginButton.textContent = 'Login';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorText.textContent = 'Eroare de conexiune. Verifică că XAMPP rulează!';
                errorMessage.classList.remove('hidden');

                // Re-enable button
                loginButton.disabled = false;
                loginButton.textContent = 'Login';
            }
        });

        // Check auth on load
        checkAuth();
    </script>
</body>
</html>
