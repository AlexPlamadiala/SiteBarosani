<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barosani - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">🏆 Admin Panel - Zidul Barosanilor</h1>
            <div class="flex items-center gap-4">
                <!-- SSE Status Badge -->
                <div id="sseStatus" class="hidden bg-green-500 px-3 py-1 rounded-lg shadow-lg flex items-center gap-2 text-xs">
                    <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                    <span>Live Updates</span>
                </div>
                <!-- Refresh Indicator -->
                <div id="refreshIndicator" class="hidden bg-yellow-500 px-3 py-1 rounded-lg shadow-lg flex items-center gap-2 text-xs animate-pulse">
                    <div class="w-2 h-2 bg-white rounded-full"></div>
                    <span>Actualizare...</span>
                </div>
                <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600">Logout</button>
            </div>
        </div>
    </nav>

    <div class="bg-white shadow">
        <div class="container mx-auto px-4">
            <div class="flex space-x-4">
                <a href="dashboard.html" class="px-4 py-3 text-gray-600 hover:text-gray-800">Dashboard</a>
                <a href="barosani.html" class="px-4 py-3 border-b-2 border-blue-600 font-semibold text-blue-600">Barosani</a>
                <a href="applications.html" class="px-4 py-3 text-gray-600 hover:text-gray-800">Cereri</a>
                <a href="logs.html" class="px-4 py-3 text-gray-600 hover:text-gray-800">Logs</a>
            </div>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow">
            <div class="p-6 border-b flex justify-between items-center flex-wrap gap-4">
                <h2 class="text-2xl font-bold">Barosani pe Zid</h2>
                <div class="flex items-center gap-3">
                    <!-- Search -->
                    <div class="relative">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Caută..."
                            onkeyup="handleSearch()"
                            class="pl-8 pr-3 py-2 border rounded-lg text-sm w-40 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                    <button onclick="showAddModal()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                        + Adaugă Barosan
                    </button>
                </div>
            </div>

            <!-- Tier Tabs -->
            <div class="px-6 py-3 border-b bg-gray-50 flex items-center gap-2 flex-wrap">
                <button onclick="setTierFilter('all')" id="tab-all" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-blue-600 text-white">
                    🎯 Toți <span id="count-all" class="ml-1 bg-white/20 px-1.5 rounded">0</span>
                </button>
                <button onclick="setTierFilter('platinum')" id="tab-platinum" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300">
                    💎 Platinum <span id="count-platinum" class="ml-1 bg-black/10 px-1.5 rounded">0</span>
                </button>
                <button onclick="setTierFilter('gold')" id="tab-gold" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300">
                    🏆 Gold <span id="count-gold" class="ml-1 bg-black/10 px-1.5 rounded">0</span>
                </button>
                <button onclick="setTierFilter('basic')" id="tab-basic" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300">
                    ⭐ Basic <span id="count-basic" class="ml-1 bg-black/10 px-1.5 rounded">0</span>
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Certificat</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nume</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tier</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Înregistrat</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Expiră</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Acțiuni</th>
                        </tr>
                    </thead>
                    <tbody id="barosaniTable" class="divide-y divide-gray-200">
                        <tr>
                            <td colspan="8" class="px-6 py-4 text-center text-gray-500">Se încarcă...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div id="paginationContainer" class="px-6 py-4 border-t bg-gray-50 flex items-center justify-between">
                <p id="paginationInfo" class="text-sm text-gray-600">Pagina 1 din 1</p>
                <div id="paginationButtons" class="flex items-center gap-1">
                    <!-- Pagination buttons will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto m-4">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 id="modalTitle" class="text-xl font-bold">Adaugă Barosan</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl">×</button>
            </div>

            <form id="barosanForm" class="p-6 space-y-4">
                <input type="hidden" id="barosanId">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Nume *</label>
                        <input type="text" id="nume" required class="w-full px-3 py-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Email *</label>
                        <input type="email" id="email" required class="w-full px-3 py-2 border rounded">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Revolut ID *</label>
                    <input type="text" id="revolutId" required class="w-full px-3 py-2 border rounded">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Motto *</label>
                    <input type="text" id="motto" required maxlength="200" class="w-full px-3 py-2 border rounded">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Tier *</label>
                        <select id="tier" required class="w-full px-3 py-2 border rounded">
                            <option value="basic">Basic</option>
                            <option value="gold">Gold</option>
                            <option value="platinum">Platinum</option>
                        </select>
                    </div>
                    <div id="statusField" class="hidden">
                        <label class="block text-sm font-semibold mb-1">Status *</label>
                        <select id="status" class="w-full px-3 py-2 border rounded">
                            <option value="active">Activ</option>
                            <option value="expired">Expirat</option>
                            <option value="suspended">Suspendat</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">URL Poză</label>
                    <input type="url" id="poza" class="w-full px-3 py-2 border rounded">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Link Personal (doar Platinum)</label>
                    <input type="url" id="link" class="w-full px-3 py-2 border rounded">
                </div>

                <div id="dateField" class="hidden">
                    <label class="block text-sm font-semibold mb-1">Data Expirare</label>
                    <input type="date" id="dataExpirare" class="w-full px-3 py-2 border rounded">
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                        Salvează
                    </button>
                    <button type="button" onclick="closeModal()" class="px-6 bg-gray-300 text-gray-700 py-2 rounded hover:bg-gray-400">
                        Anulează
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let editingId = null;
        // SSE State
        let sseConnected = false;
        let eventSource = null;

        // Filtering and Pagination State
        let allBarosani = [];
        let currentTierFilter = 'all';
        let currentSearchTerm = '';
        let currentPage = 1;
        const itemsPerPage = 20;

        async function checkAuth() {
            const response = await fetch('http://localhost/SiteBarosani/api/auth.php', {
                credentials: 'include'
            });
            const data = await response.json();
            if (!data.authenticated) window.location.href = 'index.html';
        }

        function showRefreshIndicator() {
            document.getElementById('refreshIndicator').classList.remove('hidden');
        }

        function hideRefreshIndicator() {
            document.getElementById('refreshIndicator').classList.add('hidden');
        }

        async function loadBarosani(showIndicator = true) {
            if (showIndicator) showRefreshIndicator();
            try {
                const response = await fetch('http://localhost/SiteBarosani/api/admin/barosani.php', {
                    credentials: 'include'
                });
                const data = await response.json();

                if (!data.success) {
                    allBarosani = [];
                } else {
                    allBarosani = data.barosani || [];
                }

                updateTierCounts();
                renderBarosani();
            } catch (error) {
                console.error('Error:', error);
            } finally {
                hideRefreshIndicator();
            }
        }

        function updateTierCounts() {
            const counts = {
                all: allBarosani.length,
                platinum: allBarosani.filter(b => b.tier === 'platinum').length,
                gold: allBarosani.filter(b => b.tier === 'gold').length,
                basic: allBarosani.filter(b => b.tier === 'basic').length
            };

            document.getElementById('count-all').textContent = counts.all;
            document.getElementById('count-platinum').textContent = counts.platinum;
            document.getElementById('count-gold').textContent = counts.gold;
            document.getElementById('count-basic').textContent = counts.basic;
        }

        function setTierFilter(tier) {
            currentTierFilter = tier;
            currentPage = 1;

            // Update tab styles
            ['all', 'platinum', 'gold', 'basic'].forEach(t => {
                const btn = document.getElementById('tab-' + t);
                if (t === tier) {
                    btn.className = 'px-3 py-1.5 rounded-full text-sm font-semibold bg-blue-600 text-white';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-full text-sm font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300';
                }
            });

            renderBarosani();
        }

        function handleSearch() {
            currentSearchTerm = document.getElementById('searchInput').value.toLowerCase();
            currentPage = 1;
            renderBarosani();
        }

        function getFilteredBarosani() {
            let filtered = [...allBarosani];

            // Filter by tier
            if (currentTierFilter !== 'all') {
                filtered = filtered.filter(b => b.tier === currentTierFilter);
            }

            // Filter by search
            if (currentSearchTerm) {
                filtered = filtered.filter(b =>
                    b.nume.toLowerCase().includes(currentSearchTerm) ||
                    b.email.toLowerCase().includes(currentSearchTerm) ||
                    b.certificat_id.toLowerCase().includes(currentSearchTerm) ||
                    (b.motto && b.motto.toLowerCase().includes(currentSearchTerm))
                );
            }

            return filtered;
        }

        function renderBarosani() {
            const filtered = getFilteredBarosani();
            const totalPages = Math.ceil(filtered.length / itemsPerPage);

            // Adjust current page if needed
            if (currentPage > totalPages && totalPages > 0) {
                currentPage = totalPages;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginated = filtered.slice(startIndex, startIndex + itemsPerPage);

            const tbody = document.getElementById('barosaniTable');

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-4 text-center text-gray-500">Niciun barosan găsit</td></tr>';
                document.getElementById('paginationContainer').classList.add('hidden');
                return;
            }

            document.getElementById('paginationContainer').classList.remove('hidden');

            tbody.innerHTML = paginated.map(b => {
                const statusColors = {
                    active: 'bg-green-100 text-green-800',
                    expired: 'bg-red-100 text-red-800',
                    suspended: 'bg-gray-100 text-gray-800'
                };

                const isExpiringSoon = new Date(b.data_expirare) - new Date() < 7 * 24 * 60 * 60 * 1000;

                return `
                    <tr>
                        <td class="px-6 py-4 text-sm font-mono">${b.certificat_id}</td>
                        <td class="px-6 py-4 text-sm font-medium">${b.nume}</td>
                        <td class="px-6 py-4 text-sm">${b.email}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs font-semibold rounded uppercase ${
                                b.tier === 'platinum' ? 'bg-gray-200' :
                                b.tier === 'gold' ? 'bg-yellow-200' : 'bg-blue-200'
                            }">
                                ${b.tier}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm">${new Date(b.data_inregistrare).toLocaleDateString('ro-RO')}</td>
                        <td class="px-6 py-4 text-sm ${isExpiringSoon && b.status === 'active' ? 'text-red-600 font-bold' : ''}">
                            ${new Date(b.data_expirare).toLocaleDateString('ro-RO')}
                            ${isExpiringSoon && b.status === 'active' ? '⚠️' : ''}
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs font-semibold rounded ${statusColors[b.status]}">
                                ${b.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm space-x-2">
                            <button onclick='editBarosan(${JSON.stringify(b).replace(/'/g, "\\'")})'  class="text-blue-600 hover:text-blue-800">
                                ✏️
                            </button>
                            <button onclick="deleteBarosan(${b.id})" class="text-red-600 hover:text-red-800">
                                🗑️
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            renderPagination(totalPages, filtered.length);
        }

        function renderPagination(totalPages, totalItems) {
            document.getElementById('paginationInfo').textContent =
                `Pagina ${currentPage} din ${totalPages} (${totalItems} barosani)`;

            const container = document.getElementById('paginationButtons');

            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';

            // Previous button
            html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}
                class="px-2 py-1 rounded text-xs font-semibold ${currentPage === 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}">
                ← Înapoi
            </button>`;

            // Page numbers
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);

            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                html += `<button onclick="goToPage(1)" class="w-7 h-7 rounded text-xs font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300">1</button>`;
                if (startPage > 2) {
                    html += `<span class="text-gray-400 text-xs px-1">...</span>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goToPage(${i})"
                    class="w-7 h-7 rounded text-xs font-semibold ${i === currentPage ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}">
                    ${i}
                </button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    html += `<span class="text-gray-400 text-xs px-1">...</span>`;
                }
                html += `<button onclick="goToPage(${totalPages})" class="w-7 h-7 rounded text-xs font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300">${totalPages}</button>`;
            }

            // Next button
            html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}
                class="px-2 py-1 rounded text-xs font-semibold ${currentPage === totalPages ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}">
                Înainte →
            </button>`;

            container.innerHTML = html;
        }

        function goToPage(page) {
            const filtered = getFilteredBarosani();
            const totalPages = Math.ceil(filtered.length / itemsPerPage);

            if (page < 1 || page > totalPages) return;

            currentPage = page;
            renderBarosani();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setupSSE() {
            try {
                eventSource = new EventSource('http://localhost/SiteBarosani/api/sse/updates.php');

                eventSource.addEventListener('connected', (e) => {
                    console.log('SSE Connected:', e.data);
                    sseConnected = true;
                    document.getElementById('sseStatus').classList.remove('hidden');
                });

                eventSource.addEventListener('barosani-updated', (e) => {
                    console.log('Barosani updated:', e.data);
                    loadBarosani(true); // Refresh instant când se modifică barosanii
                });

                eventSource.addEventListener('heartbeat', (e) => {
                    // Keep-alive heartbeat
                });

                eventSource.onerror = (err) => {
                    console.error('SSE Error:', err);
                    sseConnected = false;
                    document.getElementById('sseStatus').classList.add('hidden');
                    // SSE va încerca automat să reconecteze
                };
            } catch (err) {
                console.error('Failed to establish SSE connection:', err);
            }
        }

        function showAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Adaugă Barosan';
            document.getElementById('barosanForm').reset();
            document.getElementById('statusField').classList.add('hidden');
            document.getElementById('dateField').classList.add('hidden');
            document.getElementById('modal').classList.remove('hidden');
        }

        function editBarosan(barosan) {
            editingId = barosan.id;
            document.getElementById('modalTitle').textContent = 'Editează Barosan';
            document.getElementById('barosanId').value = barosan.id;
            document.getElementById('nume').value = barosan.nume;
            document.getElementById('email').value = barosan.email;
            document.getElementById('revolutId').value = barosan.revolut_id;
            document.getElementById('motto').value = barosan.motto;
            document.getElementById('tier').value = barosan.tier;
            document.getElementById('poza').value = barosan.poza || '';
            document.getElementById('link').value = barosan.link || '';
            document.getElementById('status').value = barosan.status;
            document.getElementById('dataExpirare').value = barosan.data_expirare;
            document.getElementById('statusField').classList.remove('hidden');
            document.getElementById('dateField').classList.remove('hidden');
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        document.getElementById('barosanForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                nume: document.getElementById('nume').value,
                email: document.getElementById('email').value,
                revolutId: document.getElementById('revolutId').value,
                motto: document.getElementById('motto').value,
                tier: document.getElementById('tier').value,
                poza: document.getElementById('poza').value || null,
                link: document.getElementById('link').value || null
            };

            if (editingId) {
                formData.id = editingId;
                formData.status = document.getElementById('status').value;
                formData.dataExpirare = document.getElementById('dataExpirare').value;
            }

            try {
                const response = await fetch('http://localhost/SiteBarosani/api/admin/barosani.php', {
                    method: editingId ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(formData)
                });

                const data = await response.json();
                if (data.success) {
                    closeModal();
                    loadBarosani();
                    alert(data.message);
                } else {
                    alert('Eroare: ' + data.error);
                }
            } catch (error) {
                alert('Eroare de conexiune');
            }
        });

        async function deleteBarosan(id) {
            if (!confirm('Ștergi definitiv acest barosan?')) return;

            try {
                const response = await fetch('http://localhost/SiteBarosani/api/admin/barosani.php?id=' + id, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                const data = await response.json();
                if (data.success) {
                    loadBarosani();
                }
            } catch (error) {
                alert('Eroare de conexiune');
            }
        }

        async function logout() {
            await fetch('http://localhost/SiteBarosani/api/auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ action: 'logout' })
            });
            window.location.href = 'index.html';
        }

        // Initialize
        checkAuth();
        loadBarosani(false); // Initial load fără indicator

        // Setup SSE pentru real-time updates
        setupSSE();

        // Fallback polling la 30 secunde (doar dacă SSE nu funcționează)
        setInterval(() => {
            if (!sseConnected) {
                loadBarosani(false);
            }
        }, 30000);

        // Cleanup SSE când se închide pagina
        window.addEventListener('beforeunload', () => {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>
</html>
